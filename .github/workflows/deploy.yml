name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Stim verifier
        run: python -m pip install --disable-pip-version-check stim==1.16.0

      - name: Install
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npx eslint src scripts tests

      - name: Verify lattice model
        working-directory: app
        run: npm run verify-lattice -- --require-stim

      - name: Build (runs check-data first)
        working-directory: app
        run: npm run build -- --base=/lattice-atlas/

      - name: Check production bundle budgets
        working-directory: app
        run: npm run check-bundles

      - name: Install Chromium for release checks
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility and interaction gates
        working-directory: app
        run: npm run test:e2e

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
