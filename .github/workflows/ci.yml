name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npx eslint src scripts

      - name: Verify lattice model
        working-directory: app
        run: npm run verify-lattice

      - name: Build (runs check-data first)
        working-directory: app
        run: npm run build -- --base=/lattice-atlas/
