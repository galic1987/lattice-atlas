name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Stim verifier
        run: python -m pip install --disable-pip-version-check stim==1.16.0

      - name: Install
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npx eslint src scripts tests

      - name: Verify lattice model
        working-directory: app
        run: npm run verify-lattice -- --require-stim

      - name: Build production base path (runs data and trust checks)
        working-directory: app
        run: npm run build:e2e

      - name: Check production bundle budgets
        working-directory: app
        run: npm run check-bundles

      - name: Install Chromium for release checks
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility and interaction gates
        working-directory: app
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-failures
          path: app/test-results/release-playwright
          if-no-files-found: ignore
          retention-days: 7
