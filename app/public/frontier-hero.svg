<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900">
  <defs>
    <radialGradient id="frontierBg" cx="62%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#121B31"/>
      <stop offset="60%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>
    <radialGradient id="amberCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B83D" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#F5B83D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5B83D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="frontierDots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.8" fill="#2A3A5F"/>
      <circle cx="28" cy="28" r="1.2" fill="#2A3A5F" fill-opacity="0.7"/>
      <circle cx="56" cy="0" r="1.8" fill="#2A3A5F"/>
      <circle cx="0" cy="56" r="1.8" fill="#2A3A5F"/>
      <circle cx="56" cy="56" r="1.8" fill="#2A3A5F"/>
    </pattern>
  </defs>
  <rect width="1920" height="900" fill="url(#frontierBg)"/>
  <rect width="1920" height="900" fill="url(#frontierDots)" opacity="0.8"/>

  <!-- cultivated region: amber concentric geometric crystal/factory patterns -->
  <g transform="translate(1190 430)">
    <circle r="330" fill="url(#amberCore)" opacity="0.35"/>
    <circle r="240" fill="url(#amberCore)" opacity="0.5"/>
    <circle r="150" fill="url(#amberCore)" opacity="0.7"/>
    <g fill="none" stroke="#F5B83D">
      <polygon points="0,-190 165,-95 165,95 0,190 -165,95 -165,-95" stroke-opacity="0.75" stroke-width="2"/>
      <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" stroke-opacity="0.85" stroke-width="1.6"/>
      <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" stroke-opacity="0.95" stroke-width="1.4"/>
      <circle r="34" stroke-opacity="1" stroke-width="1.6"/>
      <circle r="260" stroke-opacity="0.3" stroke-dasharray="3 9"/>
    </g>
    <!-- crystalline spokes -->
    <g stroke="#F5B83D" stroke-opacity="0.55" stroke-width="1.4">
      <line x1="0" y1="-34" x2="0" y2="-190"/>
      <line x1="29" y1="17" x2="165" y2="95"/>
      <line x1="-29" y1="17" x2="-165" y2="95"/>
      <line x1="29" y1="-17" x2="165" y2="-95" stroke-opacity="0.4"/>
      <line x1="-29" y1="-17" x2="-165" y2="-95" stroke-opacity="0.4"/>
    </g>
    <circle r="9" fill="#FDE9C0"/>
  </g>

  <!-- cyan & violet accent threads feeding into the cultivated region -->
  <g fill="none" stroke-linecap="round">
    <path d="M120 720 C 420 700, 620 560, 900 520 C 1010 505, 1080 480, 1130 460" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="1.6"/>
    <path d="M200 180 C 500 220, 700 300, 920 350 C 1020 372, 1090 400, 1140 415" stroke="#8B5CF6" stroke-opacity="0.7" stroke-width="1.6"/>
    <path d="M1700 140 C 1560 200, 1440 280, 1340 360" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.4"/>
    <path d="M1780 720 C 1620 660, 1480 580, 1370 500" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.4"/>
  </g>
  <g>
    <circle cx="120" cy="720" r="4" fill="#22D3EE"/>
    <circle cx="200" cy="180" r="4" fill="#8B5CF6"/>
    <circle cx="1700" cy="140" r="3.5" fill="#22D3EE"/>
    <circle cx="1780" cy="720" r="3.5" fill="#8B5CF6"/>
  </g>
</svg>
