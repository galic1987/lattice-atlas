<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#9B7BFA"/>
    </linearGradient>
    <pattern id="ogLattice" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="2" fill="#2A3A5F"/>
      <circle cx="30" cy="30" r="1.3" fill="#2A3A5F" fill-opacity="0.7"/>
      <circle cx="60" cy="0" r="2" fill="#2A3A5F"/>
      <circle cx="0" cy="60" r="2" fill="#2A3A5F"/>
      <circle cx="60" cy="60" r="2" fill="#2A3A5F"/>
    </pattern>
    <radialGradient id="ogPlaq" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#155E75"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0A0F1C"/>
  <rect width="1200" height="630" fill="url(#ogLattice)" opacity="0.6"/>

  <!-- braid line -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M60 560 C 320 560, 420 500, 640 500 C 860 500, 940 560, 1140 520" stroke="#22D3EE" stroke-opacity="0.7"/>
    <path d="M60 520 C 320 520, 420 560, 640 560 C 860 560, 940 500, 1140 545" stroke="#9B7BFA" stroke-opacity="0.7"/>
  </g>
  <circle cx="60" cy="560" r="4" fill="#22D3EE"/>
  <circle cx="60" cy="520" r="4" fill="#9B7BFA"/>

  <!-- logo mark -->
  <g transform="translate(80 88) scale(1.5)">
    <g fill="#22D3EE">
      <circle cx="10" cy="10" r="4"/><circle cx="32" cy="10" r="4"/><circle cx="54" cy="10" r="4"/>
      <circle cx="10" cy="32" r="4"/><circle cx="54" cy="32" r="4"/>
      <circle cx="10" cy="54" r="4"/><circle cx="32" cy="54" r="4"/><circle cx="54" cy="54" r="4"/>
    </g>
    <rect x="20" y="20" width="24" height="24" rx="3" transform="rotate(45 32 32)" fill="url(#ogPlaq)"/>
    <circle cx="32" cy="32" r="4" fill="#EAF0FB"/>
  </g>

  <!-- wordmark + title -->
  <text x="196" y="152" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="600" fill="#EAF0FB">Lattice Atlas</text>
  <text x="80" y="300" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700" fill="#EAF0FB">Learn Topological</text>
  <text x="80" y="384" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700" fill="url(#ogTitle)">Quantum Error Correction</text>
  <text x="80" y="452" font-family="'JetBrains Mono', monospace" font-size="20" fill="#A9B4CC">23 papers · 26 topics · 6 tiers · 1998 → 2026</text>
</svg>
