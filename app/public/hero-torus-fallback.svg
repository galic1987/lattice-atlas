<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#121B31"/>
      <stop offset="55%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>
    <linearGradient id="torusStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="syndromeRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- tilted wireframe torus: elliptical parallels + meridians -->
  <g transform="translate(960 540) rotate(-12) scale(1 0.58)" stroke="url(#torusStroke)" fill="none" stroke-width="1.2">
    <!-- parallels (rings of latitude on torus surface) -->
    <circle r="430" stroke-opacity="0.9" stroke-width="2"/>
    <circle r="362" stroke-opacity="0.55"/>
    <circle r="296" stroke-opacity="0.5"/>
    <circle r="232" stroke-opacity="0.45"/>
    <circle r="170" stroke-opacity="0.5"/>
    <circle r="112" stroke-opacity="0.6"/>
    <!-- inner edge of the hole -->
    <circle r="60" stroke-opacity="0.75" stroke-width="1.6"/>
  </g>
  <!-- meridian ellipses (cross-section circles around the ring) -->
  <g transform="translate(960 540) rotate(-12)" fill="none" stroke="url(#torusStroke)" stroke-width="1.1" stroke-opacity="0.6">
    <ellipse cx="-300" cy="0" rx="118" ry="70"/>
    <ellipse cx="300" cy="0" rx="118" ry="70"/>
    <ellipse cx="-212" cy="-174" rx="118" ry="70" transform="rotate(39 -212 -174)"/>
    <ellipse cx="212" cy="174" rx="118" ry="70" transform="rotate(39 212 174)"/>
    <ellipse cx="212" cy="-174" rx="118" ry="70" transform="rotate(-39 212 -174)"/>
    <ellipse cx="-212" cy="174" rx="118" ry="70" transform="rotate(-39 -212 174)"/>
    <ellipse cx="0" cy="-246" rx="118" ry="70" transform="rotate(90 0 -246)"/>
    <ellipse cx="0" cy="246" rx="118" ry="70" transform="rotate(90 0 246)"/>
  </g>

  <!-- lattice nodes wrapped on the torus surface (alternating cyan / violet) -->
  <g transform="translate(960 540) rotate(-12) scale(1 0.58)">
    <g>
      <circle cx="430" cy="0" r="26" fill="url(#nodeCyan)"/><circle cx="430" cy="0" r="4" fill="#22D3EE"/>
      <circle cx="362" cy="120" r="26" fill="url(#nodeViolet)"/><circle cx="362" cy="120" r="4" fill="#8B5CF6"/>
      <circle cx="-296" cy="150" r="26" fill="url(#nodeCyan)"/><circle cx="-296" cy="150" r="4" fill="#22D3EE"/>
      <circle cx="232" cy="-190" r="26" fill="url(#nodeViolet)"/><circle cx="232" cy="-190" r="4" fill="#8B5CF6"/>
      <circle cx="-170" cy="-260" r="26" fill="url(#nodeCyan)"/><circle cx="-170" cy="-260" r="4" fill="#22D3EE"/>
      <circle cx="-362" cy="-120" r="26" fill="url(#nodeViolet)"/><circle cx="-362" cy="-120" r="4" fill="#8B5CF6"/>
      <circle cx="112" cy="300" r="26" fill="url(#nodeCyan)"/><circle cx="112" cy="300" r="4" fill="#22D3EE"/>
      <circle cx="-430" cy="20" r="26" fill="url(#nodeViolet)"/><circle cx="-430" cy="20" r="4" fill="#8B5CF6"/>
      <circle cx="296" cy="200" r="26" fill="url(#nodeCyan)"/><circle cx="296" cy="200" r="4" fill="#22D3EE"/>
      <circle cx="-232" cy="300" r="26" fill="url(#nodeViolet)"/><circle cx="-232" cy="300" r="4" fill="#8B5CF6"/>
      <circle cx="170" cy="-320" r="26" fill="url(#nodeCyan)"/><circle cx="170" cy="-320" r="4" fill="#22D3EE"/>
      <circle cx="-112" cy="-350" r="26" fill="url(#nodeViolet)"/><circle cx="-112" cy="-350" r="4" fill="#8B5CF6"/>
    </g>
    <!-- syndrome flashes (rose) -->
    <circle cx="330" cy="-160" r="52" fill="url(#syndromeRose)"/><circle cx="330" cy="-160" r="5" fill="#FB7185"/>
    <circle cx="-260" cy="60" r="46" fill="url(#syndromeRose)"/><circle cx="-260" cy="60" r="5" fill="#FB7185"/>
    <circle cx="60" cy="340" r="42" fill="url(#syndromeRose)"/><circle cx="60" cy="340" r="5" fill="#FB7185"/>
  </g>

  <!-- scattered faint lattice dots in the background -->
  <g fill="#2A3A5F">
    <circle cx="220" cy="180" r="2.5"/><circle cx="420" cy="120" r="2"/><circle cx="1560" cy="200" r="2.5"/>
    <circle cx="1700" cy="420" r="2"/><circle cx="240" cy="820" r="2.5"/><circle cx="520" cy="940" r="2"/>
    <circle cx="1480" cy="900" r="2.5"/><circle cx="1740" cy="760" r="2"/><circle cx="120" cy="520" r="2"/>
    <circle cx="1810" cy="560" r="2"/><circle cx="760" cy="140" r="2"/><circle cx="1180" cy="960" r="2.5"/>
  </g>

  <!-- bloom halo behind torus -->
  <circle cx="960" cy="540" r="560" fill="url(#nodeCyan)" opacity="0.16"/>

  <!-- vignette -->
  <rect width="1920" height="1080" fill="url(#bgGlow)" opacity="0.35"/>
</svg>
