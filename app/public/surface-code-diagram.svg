<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <defs>
    <radialGradient id="scRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="720" fill="#0A0F1C"/>
  <!-- grid origin: 5x5 data qubits, spacing 130, origin (155,85) -->
  <g>
    <!-- plaquette faces (checkerboard: cyan Z, violet X) -->
    <!-- row 0 -->
    <rect x="155" y="85" width="130" height="130" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="415" y="85" width="130" height="130" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="285" y="85" width="130" height="130" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="545" y="85" width="130" height="130" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- row 1 -->
    <rect x="285" y="215" width="130" height="130" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="545" y="215" width="130" height="130" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="155" y="215" width="130" height="130" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="415" y="215" width="130" height="130" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- row 2 -->
    <rect x="155" y="345" width="130" height="130" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="415" y="345" width="130" height="130" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="285" y="345" width="130" height="130" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="545" y="345" width="130" height="130" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- row 3 -->
    <rect x="285" y="475" width="130" height="130" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="545" y="475" width="130" height="130" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="155" y="475" width="130" height="130" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="415" y="475" width="130" height="130" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- boundary half-plaquettes -->
    <rect x="155" y="-45" width="130" height="130" fill="#8B5CF6" fill-opacity="0.07" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 6"/>
    <rect x="415" y="-45" width="130" height="130" fill="#8B5CF6" fill-opacity="0.07" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 6"/>
    <rect x="285" y="605" width="130" height="130" fill="#8B5CF6" fill-opacity="0.07" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 6"/>
    <rect x="545" y="605" width="130" height="130" fill="#8B5CF6" fill-opacity="0.07" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 6"/>
  </g>

  <!-- lattice edges -->
  <g stroke="#3D5178" stroke-width="1.4">
    <line x1="155" y1="85" x2="805" y2="85"/><line x1="155" y1="215" x2="805" y2="215"/>
    <line x1="155" y1="345" x2="805" y2="345"/><line x1="155" y1="475" x2="805" y2="475"/>
    <line x1="155" y1="605" x2="805" y2="605"/>
    <line x1="155" y1="85" x2="155" y2="605"/><line x1="285" y1="85" x2="285" y2="605"/>
    <line x1="415" y1="85" x2="415" y2="605"/><line x1="545" y1="85" x2="545" y2="605"/>
    <line x1="675" y1="85" x2="675" y2="605"/><line x1="805" y1="85" x2="805" y2="605"/>
  </g>

  <!-- error chain (rose) crossing two plaquettes -->
  <g class="error-chain">
    <path d="M285 215 L 285 345 L 415 345 L 415 475" fill="none" stroke="#FB7185" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="285" cy="215" r="30" fill="url(#scRose)"/>
    <circle cx="415" cy="475" r="30" fill="url(#scRose)"/>
    <path d="M273 203 L297 227 M297 203 L273 227" stroke="#FB7185" stroke-width="4" stroke-linecap="round"/>
    <path d="M403 463 L427 487 M427 463 L403 487" stroke="#FB7185" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- data qubits (circles on vertices) -->
  <g fill="#0E1526" stroke="#EAF0FB" stroke-width="2.2">
    <circle cx="155" cy="85" r="13"/><circle cx="285" cy="85" r="13"/><circle cx="415" cy="85" r="13"/><circle cx="545" cy="85" r="13"/><circle cx="675" cy="85" r="13"/><circle cx="805" cy="85" r="13"/>
    <circle cx="155" cy="215" r="13"/><circle cx="285" cy="215" r="13"/><circle cx="415" cy="215" r="13"/><circle cx="545" cy="215" r="13"/><circle cx="675" cy="215" r="13"/><circle cx="805" cy="215" r="13"/>
    <circle cx="155" cy="345" r="13"/><circle cx="285" cy="345" r="13"/><circle cx="415" cy="345" r="13"/><circle cx="545" cy="345" r="13"/><circle cx="675" cy="345" r="13"/><circle cx="805" cy="345" r="13"/>
    <circle cx="155" cy="475" r="13"/><circle cx="285" cy="475" r="13"/><circle cx="415" cy="475" r="13"/><circle cx="545" cy="475" r="13"/><circle cx="675" cy="475" r="13"/><circle cx="805" cy="475" r="13"/>
    <circle cx="155" cy="605" r="13"/><circle cx="285" cy="605" r="13"/><circle cx="415" cy="605" r="13"/><circle cx="545" cy="605" r="13"/><circle cx="675" cy="605" r="13"/><circle cx="805" cy="605" r="13"/>
  </g>

  <!-- minimal labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="16" fill="#64708E">
    <text x="220" y="155" fill="#22D3EE">Z</text>
    <text x="350" y="155" fill="#8B5CF6">X</text>
    <text x="480" y="285" fill="#22D3EE">Z</text>
    <text x="220" y="285" fill="#8B5CF6">X</text>
    <text x="350" y="545" fill="#FB7185">error chain</text>
  </g>
</svg>
