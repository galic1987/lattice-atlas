<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="plaquetteGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#155E75"/>
    </radialGradient>
  </defs>
  <!-- 3x3 qubit lattice dots -->
  <g fill="#22D3EE">
    <circle cx="10" cy="10" r="4"/>
    <circle cx="32" cy="10" r="4"/>
    <circle cx="54" cy="10" r="4"/>
    <circle cx="10" cy="32" r="4"/>
    <circle cx="54" cy="32" r="4"/>
    <circle cx="10" cy="54" r="4"/>
    <circle cx="32" cy="54" r="4"/>
    <circle cx="54" cy="54" r="4"/>
  </g>
  <!-- lattice edges -->
  <g stroke="#22D3EE" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <line x1="14" y1="10" x2="28" y2="10"/>
    <line x1="36" y1="10" x2="50" y2="10"/>
    <line x1="14" y1="54" x2="28" y2="54"/>
    <line x1="36" y1="54" x2="50" y2="54"/>
    <line x1="10" y1="14" x2="10" y2="28"/>
    <line x1="10" y1="36" x2="10" y2="50"/>
    <line x1="54" y1="14" x2="54" y2="28"/>
    <line x1="54" y1="36" x2="54" y2="50"/>
  </g>
  <!-- glowing center plaquette diamond -->
  <rect x="20" y="20" width="24" height="24" rx="3" transform="rotate(45 32 32)" fill="url(#plaquetteGlow)"/>
  <circle cx="32" cy="32" r="4" fill="#EAF0FB"/>
</svg>
