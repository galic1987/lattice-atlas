<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="anyonViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="anyonCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="anyonLattice" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.6" fill="#2A3A5F"/>
      <circle cx="25" cy="25" r="1" fill="#2A3A5F" fill-opacity="0.7"/>
      <circle cx="50" cy="0" r="1.6" fill="#2A3A5F"/>
      <circle cx="0" cy="50" r="1.6" fill="#2A3A5F"/>
      <circle cx="50" cy="50" r="1.6" fill="#2A3A5F"/>
    </pattern>
  </defs>
  <!-- flat lattice plane -->
  <rect width="800" height="600" fill="url(#anyonLattice)"/>
  <g stroke="#2A3A5F" stroke-opacity="0.5" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- dashed world-line: e anyon circling m anyon -->
  <path d="M250 420 C 250 250, 330 180, 430 190 C 545 202, 600 280, 590 360 C 580 445, 480 480, 400 470 C 330 462, 280 450, 250 420 Z"
        fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="8 8" stroke-linecap="round"/>
  <path d="M590 360 C 596 372, 596 372, 588 384" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- m anyon pair (cyan) -->
  <circle cx="430" cy="330" r="44" fill="url(#anyonCyan)"/>
  <circle cx="430" cy="330" r="11" fill="#22D3EE"/>
  <text x="424" y="336" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#05080F">m</text>
  <circle cx="560" cy="480" r="34" fill="url(#anyonCyan)"/>
  <circle cx="560" cy="480" r="9" fill="#22D3EE" fill-opacity="0.85"/>
  <text x="555" y="485" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#05080F">m</text>
  <path d="M445 355 C 490 400, 525 440, 552 468" fill="none" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="5 7"/>

  <!-- e anyon pair (violet) -->
  <circle cx="250" cy="420" r="44" fill="url(#anyonViolet)"/>
  <circle cx="250" cy="420" r="11" fill="#8B5CF6"/>
  <text x="244" y="426" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#EAF0FB">e</text>
  <circle cx="150" cy="200" r="34" fill="url(#anyonViolet)"/>
  <circle cx="150" cy="200" r="9" fill="#8B5CF6" fill-opacity="0.85"/>
  <text x="145" y="205" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#EAF0FB">e</text>
  <path d="M163 225 C 195 290, 225 355, 242 405" fill="none" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="5 7"/>
</svg>
